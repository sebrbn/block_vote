<!DOCTYPE html>
<html>
<head><title>Cast Vote</title></head>
<body>
    <form action="/cast_vote" method="POST">
    <h3>Your Secure Token:</h3>
    <div style="background:#eee; padding:10px; word-break: break-all;">{{ token }}</div>

    <h3>Select Candidate:</h3>
    <select name="candidate" style="padding:10px;">
        {% for candidate in candidates %}
            <option value="{{ candidate }}">{{ candidate }}</option>
        {% endfor %}
    </select>

    <br><br>
    <button type="submit" style="padding:10px 20px; background:#007bff; color:white; border:none; cursor:pointer;">
        1. Request Admin Signature (Blinds Vote)
    </button>
</form>
</body>
</html>
