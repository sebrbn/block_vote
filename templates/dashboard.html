<!DOCTYPE html>
<html>
<head><title>Dashboard</title></head>
<body>
    <h2>Welcome, {{ user }}</h2>
    <p>You are authenticated via OTP.</p>
    <hr>
    <form action="/generate_token" method="POST">
        <button type="submit" style="padding:15px; background:green; color:white;">
             Generate Token & Vote
        </button>
    </form>
    <br>
    <a href="/logout">Logout</a>
    <div style="margin-top: 30px;">
    <a href="/results" style="padding: 10px 20px; background: #17a2b8; color: white; text-decoration: none; border-radius: 5px;">
        View Live Results
    </a>
</div>
</body>
</html>
