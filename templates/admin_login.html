<!DOCTYPE html>
<html>

<head>
    <title>Admin Login - RSA Secure</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #16213e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #e94560;
            margin-bottom: 30px;
        }

        .challenge {
            background: #0f3460;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            margin-bottom: 20px;
            color: #00d2ff;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            border: none;
            background: #0f3460;
            color: #fff;
            box-sizing: border-box;
        }

        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }

        button:hover {
            background: #ff4d6d;
        }

        p {
            font-size: 0.9em;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h1>Admin Authentication</h1>
        <p>Challenge string to sign:</p>
        <div class="challenge">{{ challenge }}</div>

        <form action="/admin/login" method="POST">
            <input type="number" name="signature" placeholder="Enter RSA Signature" required>
            <button type="submit">Verify & Login</button>
        </form>

        <p>Use your Admin Private Key to sign the challenge above.</p>
    </div>
</body>

</html>
